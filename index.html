<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DARTSLIVE Board</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --line: #2a2f3b;
    --text: #eef1f6;
    --muted: #8a93a6;
    --seg-dark: #1b1b1f;
    --seg-light: #e9e2cf;
    --ring-a: #d6283a;
    --ring-b: #1f63c9;
    --wire: #6b7280;
    --hit: #ffd400;
    --hit-rgb: 255, 212, 0;
    --ok: #34d399;
    --warn: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    padding-top: max(12px, env(safe-area-inset-top));
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .04em; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.on::before { background: var(--ok); }
  #status.err::before { background: var(--warn); }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 14px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--hit); color: #111; border-color: var(--hit); font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px;
  }
  .board-wrap { min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg#board { width: 100%; height: 100%; max-height: calc(100vh - 100px); }
  #board .seg { stroke: var(--wire); stroke-width: .6; cursor: pointer; }
  #board .num { fill: var(--text); font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; transition: fill .3s; }
  #board .num.lit { fill: var(--hit); transition: none; }
  #overlay path, #overlay circle { pointer-events: none; }
  #overlay .hit { fill: var(--hit); stroke: #fff; stroke-width: 2; filter: url(#glow); animation: hit 1s ease-out forwards; }
  #overlay .ripple { fill: none; stroke: var(--hit); stroke-width: 3; animation: ripple .7s ease-out forwards; }
  @keyframes hit {
    0%   { fill: #fff; opacity: 1; }
    15%  { fill: var(--hit); opacity: 1; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes ripple { 0% { r: 4; opacity: 1; } 100% { r: 60; opacity: 0; } }

  aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .top { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  #last { font-size: 48px; font-weight: 800; line-height: 1.1; color: var(--hit); min-height: 1.1em; }
  #last.pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .stats { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .stats b { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }

  .table-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .table-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .table-head button { padding: 4px 10px; font-size: 12px; }
  .table-scroll { overflow: auto; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 1px 4px; height: 20px; text-align: center; }
  thead th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line); }
  tbody th { font-weight: 700; text-align: left; padding-left: 8px; }
  tbody tr + tr { border-top: 1px solid #20242e; }
  td { border-radius: 4px; background: rgba(var(--hit-rgb), var(--heat, 0)); }
  td.zero { color: #4a5263; }
  td.sum { font-weight: 700; background: none; }
  td.bump { animation: bump .6s ease-out; }
  @keyframes bump { 0% { outline: 2px solid var(--hit); color: var(--hit); } 100% { outline: 2px solid transparent; } }
  td.na { background: none; }
  tr.bull-row th { color: var(--ring-a); }

  details summary { cursor: pointer; }
  #log { font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; max-height: 80px; overflow: auto; margin: 6px 0 0; padding: 0; list-style: none; }

  @media (max-width: 820px) {
    html, body { height: auto; }
    header { position: sticky; top: 0; z-index: 1; background: var(--bg); gap: 8px; padding-left: 12px; padding-right: 12px; }
    header h1 { display: none; }
    main { grid-template-columns: minmax(0, 1fr); padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    svg#board { max-height: 60vh; }
    .table-scroll { overflow: visible; }
    #last { font-size: 40px; }
  }
</style>
</head>
<body>
<header>
  <h1>DARTSLIVE Board</h1>
  <span id="status">未接続</span>
  <span class="spacer"></span>
  <button id="mute" title="音のON/OFF">🔊 音あり</button>
  <button id="connect" class="primary">接続</button>
</header>

<main>
  <div class="board-wrap">
    <svg id="board" viewBox="-205 -205 410 410" aria-label="ダーツボード">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle r="203" fill="#08090c"/>
      <g id="segments"></g>
      <g id="numbers"></g>
      <g id="overlay"></g>
    </svg>
  </div>

  <aside>
    <div class="card top">
      <div>
        <div class="label">LAST HIT</div>
        <div id="last">-</div>
      </div>
      <div class="stats">
        <div>投数 <b id="throws">0</b></div>
        <div>合計 <b id="total">0</b></div>
        <div>平均 <b id="avg">-</b></div>
      </div>
    </div>

    <div class="card table-card">
      <div class="table-head">
        <span class="label">HIT COUNT</span>
        <button id="reset">リセット</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th></th><th>S内</th><th>T</th><th>S外</th><th>D</th><th>計</th></tr></thead>
          <tbody id="counts"></tbody>
        </table>
      </div>
    </div>

    <details class="card">
      <summary class="label">RAW</summary>
      <ul id="log"></ul>
    </details>
  </aside>
</main>

<script src="sounds.js"></script>
<script>
// ---- BLE protocol (DARTSLIVE Home) ----
// notify on 6e40fff6: a1 03 CC 00 00
//   CC 0x01-0x14 inner single / 0x15-0x28 outer single / 0x29-0x3c double / 0x3d-0x50 triple
//   0x51 outer bull / 0x52 inner bull / 0x54 CHANGE button
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NOTIFY_UUID = '6e40fff6-b5a3-f393-e0a9-e50e24dcca9e';
const RINGS = [
  { ring: 'S_IN', mult: 1, prefix: 'S' },
  { ring: 'S_OUT', mult: 1, prefix: 'S' },
  { ring: 'D', mult: 2, prefix: 'D' },
  { ring: 'T', mult: 3, prefix: 'T' },
];

function decode(code) {
  if (code >= 0x01 && code <= 0x50) {
    const { ring, mult, prefix } = RINGS[Math.floor((code - 1) / 20)];
    const num = (code - 1) % 20 + 1;
    return { kind: 'hit', id: `${ring}-${num}`, num, ring, label: `${prefix}${num}`, score: num * mult };
  }
  if (code === 0x51) return { kind: 'hit', id: 'BULL_OUT', num: 25, ring: 'BULL_OUT', label: 'BULL', score: 50 };
  if (code === 0x52) return { kind: 'hit', id: 'BULL_IN', num: 25, ring: 'BULL_IN', label: 'D-BULL', score: 50 };
  if (code === 0x54) return { kind: 'change', label: 'CHANGE' };
  return { kind: 'unknown' };
}

// ---- Board drawing ----
const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const R = { bullIn: 12, bullOut: 28, tripIn: 98, tripOut: 114, dblIn: 154, dblOut: 170, num: 188 };
const NS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
const segPaths = new Map(); // id -> { d, cx, cy }

// angle in degrees, 0 = up, clockwise
const pt = (r, a) => {
  const t = (a - 90) * Math.PI / 180;
  return [+(r * Math.cos(t)).toFixed(2), +(r * Math.sin(t)).toFixed(2)];
};
function sector(r0, r1, a0, a1) {
  const [x0, y0] = pt(r1, a0), [x1, y1] = pt(r1, a1), [x2, y2] = pt(r0, a1), [x3, y3] = pt(r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}
function circlePath(r) {
  return `M${-r} 0A${r} ${r} 0 1 0 ${r} 0A${r} ${r} 0 1 0 ${-r} 0Z`;
}
function addSeg(id, d, fill, cx, cy) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  p.setAttribute('fill', fill);
  p.setAttribute('fill-rule', 'evenodd');
  p.setAttribute('class', 'seg');
  p.dataset.id = id;
  $('#segments').appendChild(p);
  segPaths.set(id, { d, cx, cy });
}

function drawBoard() {
  const css = getComputedStyle(document.documentElement);
  const c = (n) => css.getPropertyValue(n).trim();
  ORDER.forEach((num, i) => {
    const a0 = i * 18 - 9, a1 = i * 18 + 9, mid = i * 18;
    const single = i % 2 === 0 ? c('--seg-dark') : c('--seg-light');
    const ring = i % 2 === 0 ? c('--ring-a') : c('--ring-b');
    const layers = [
      ['S_IN', R.bullOut, R.tripIn, single],
      ['T', R.tripIn, R.tripOut, ring],
      ['S_OUT', R.tripOut, R.dblIn, single],
      ['D', R.dblIn, R.dblOut, ring],
    ];
    for (const [ringName, r0, r1, fill] of layers) {
      const [cx, cy] = pt((r0 + r1) / 2, mid);
      addSeg(`${ringName}-${num}`, sector(r0, r1, a0, a1), fill, cx, cy);
    }
    const [tx, ty] = pt(R.num, mid);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', tx); t.setAttribute('y', ty);
    t.setAttribute('class', 'num');
    t.dataset.num = num;
    t.textContent = num;
    $('#numbers').appendChild(t);
  });
  addSeg('BULL_OUT', circlePath(R.bullOut) + circlePath(R.bullIn), c('--ring-a'), 0, -(R.bullIn + R.bullOut) / 2);
  addSeg('BULL_IN', circlePath(R.bullIn), c('--seg-dark'), 0, 0);
}

// ---- Sound player (音の中身は sounds.js で設定) ----
let audio = null;
let muted = false;
const fileCache = new Map(); // path -> Promise<AudioBuffer>

function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
}
function playTone({ freq, at = 0, dur = 0.2, type = 'sine', gain = 0.25, slideTo }) {
  const t = audio.currentTime + at;
  const osc = audio.createOscillator();
  const g = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}
async function playFile(path) {
  if (!fileCache.has(path)) {
    fileCache.set(path, fetch(path).then((r) => r.arrayBuffer()).then((b) => audio.decodeAudioData(b)));
  }
  const src = audio.createBufferSource();
  src.buffer = await fileCache.get(path);
  src.connect(audio.destination);
  src.start();
}
function playSound(ev) {
  if (muted) return;
  ensureAudio();
  const key = [ev.label, ev.ring, 'default'].find((k) => k && k in SOUNDS);
  const sound = key && SOUNDS[key];
  if (!sound) return;
  if (typeof sound === 'string') playFile(sound).catch((e) => console.error('sound file error:', sound, e));
  else sound.forEach(playTone);
}

// ---- Stats / hit count table ----
const COLS = ['S_IN', 'T', 'S_OUT', 'D'];
const ROWS = [...Array(20)].map((_, i) => i + 1);
let counts = new Map(); // segment id -> count
let throws = 0;
let total = 0;

function buildTable() {
  const tbody = $('#counts');
  for (const n of ROWS) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<th>${n}</th>` + COLS.map((c) => `<td data-id="${c}-${n}"></td>`).join('') + `<td class="sum" data-row="${n}"></td>`;
    tbody.appendChild(tr);
  }
  const bull = document.createElement('tr');
  bull.className = 'bull-row';
  bull.innerHTML = `<th>BULL</th><td data-id="BULL_IN" data-prefix="内 " title="インナーブル"></td><td class="na"></td><td data-id="BULL_OUT" data-prefix="外 " title="アウターブル"></td><td class="na"></td><td class="sum" data-row="25"></td>`;
  tbody.appendChild(bull);
}
function renderTable(bumpId) {
  const max = Math.max(1, ...counts.values());
  document.querySelectorAll('#counts td[data-id]').forEach((td) => {
    const n = counts.get(td.dataset.id) || 0;
    td.textContent = (td.dataset.prefix || '') + (n || '·');
    td.classList.toggle('zero', n === 0);
    td.style.setProperty('--heat', n ? (0.12 + 0.5 * n / max).toFixed(2) : 0);
  });
  document.querySelectorAll('#counts td[data-row]').forEach((td) => {
    const row = Number(td.dataset.row);
    const ids = row === 25 ? ['BULL_IN', 'BULL_OUT'] : COLS.map((c) => `${c}-${row}`);
    const n = ids.reduce((s, id) => s + (counts.get(id) || 0), 0);
    td.textContent = n || '·';
    td.classList.toggle('zero', n === 0);
  });
  if (bumpId) {
    const td = document.querySelector(`#counts td[data-id="${bumpId}"]`);
    if (td) {
      td.classList.remove('bump'); void td.offsetWidth; td.classList.add('bump');
      const box = $('.table-scroll');
      const top = td.offsetTop - 24, bottom = td.offsetTop + td.offsetHeight;
      if (top < box.scrollTop) box.scrollTop = top;
      else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight;
    }
  }
  $('#throws').textContent = throws;
  $('#total').textContent = total;
  $('#avg').textContent = throws ? (total / throws).toFixed(2) : '-';
}

// ---- Highlight (約1秒で消灯) ----
const numTimers = new Map();
function highlight(ev) {
  const seg = segPaths.get(ev.id);
  if (!seg) return;
  const overlay = $('#overlay');
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', seg.d);
  p.setAttribute('fill-rule', 'evenodd');
  p.setAttribute('class', 'hit');
  overlay.appendChild(p);
  setTimeout(() => p.remove(), 1000);

  const ripple = document.createElementNS(NS, 'circle');
  ripple.setAttribute('cx', seg.cx);
  ripple.setAttribute('cy', seg.cy);
  ripple.setAttribute('class', 'ripple');
  overlay.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);

  const label = ev.num !== 25 && document.querySelector(`.num[data-num="${ev.num}"]`);
  if (label) {
    label.classList.add('lit');
    clearTimeout(numTimers.get(ev.num));
    numTimers.set(ev.num, setTimeout(() => label.classList.remove('lit'), 1000));
  }
}

function handleEvent(ev) {
  if (ev.kind === 'change') {
    playSound(ev);
    return;
  }
  if (ev.kind !== 'hit') return;
  throws++;
  total += ev.score;
  counts.set(ev.id, (counts.get(ev.id) || 0) + 1);
  highlight(ev);
  playSound(ev);

  const last = $('#last');
  last.textContent = ev.label;
  last.classList.remove('pop'); void last.offsetWidth; last.classList.add('pop');
  renderTable(ev.id);
}

function logRaw(bytes) {
  const li = document.createElement('li');
  li.textContent = `${new Date().toLocaleTimeString()}  ${[...bytes].map((b) => b.toString(16).padStart(2, '0')).join(' ')}`;
  $('#log').prepend(li);
  while ($('#log').children.length > 50) $('#log').lastChild.remove();
}

// ---- BLE connection ----
let device = null;
function setStatus(text, cls = '') {
  const s = $('#status');
  s.textContent = text;
  s.className = cls;
}
function onNotify(e) {
  const v = e.target.value;
  const bytes = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  logRaw(bytes);
  if (bytes[0] !== 0xa1 || bytes.length < 3) return;
  handleEvent(decode(bytes[2]));
}
async function connect() {
  ensureAudio();
  if (!navigator.bluetooth) {
    setStatus('Web Bluetooth 非対応です（PC は Chrome、iPhone は Bluefy で開いてください）', 'err');
    return;
  }
  const btn = $('#connect');
  btn.disabled = true;
  try {
    if (!device) {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'DARTSLIVE' }, { services: [SERVICE_UUID] }],
        optionalServices: [SERVICE_UUID],
      });
      device.addEventListener('gattserverdisconnected', () => {
        setStatus('切断されました', 'err');
        btn.textContent = '再接続';
        btn.disabled = false;
      });
    }
    setStatus('接続中…');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const ch = await service.getCharacteristic(NOTIFY_UUID);
    ch.addEventListener('characteristicvaluechanged', onNotify);
    await ch.startNotifications();
    setStatus(`接続中: ${device.name}`, 'on');
    btn.textContent = '接続済み';
  } catch (err) {
    console.error(err);
    setStatus(`接続エラー: ${err.message}`, 'err');
    btn.textContent = device ? '再接続' : '接続';
    btn.disabled = false;
  }
}

// ---- UI wiring ----
drawBoard();
buildTable();
renderTable();
$('#connect').addEventListener('click', connect);
$('#mute').addEventListener('click', (e) => {
  muted = !muted;
  e.currentTarget.textContent = muted ? '🔇 ミュート' : '🔊 音あり';
});
$('#reset').addEventListener('click', () => {
  counts = new Map();
  throws = 0;
  total = 0;
  $('#last').textContent = '-';
  renderTable();
});
// ボードの絵をクリックするとヒットを試せる
$('#segments').addEventListener('click', (e) => {
  const id = e.target.dataset?.id;
  if (!id) return;
  ensureAudio();
  const [ring, n] = id.split('-');
  const code = id === 'BULL_OUT' ? 0x51 : id === 'BULL_IN' ? 0x52
    : RINGS.findIndex((r) => r.ring === ring) * 20 + Number(n);
  handleEvent(decode(code));
});
</script>
</body>
</html>
